<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.45" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(420px); opacity: 0; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
    .stream-line { stroke-dasharray: 20, 10; animation: dashStream 12s linear infinite; }
    .stream-line-rev { stroke-dasharray: 15, 12; animation: dashStream 9s linear infinite reverse; }
    .particle { animation: floatParticle 5s ease-in-out infinite; }
    .p2 { animation-delay: 1.8s; }
    .p3 { animation-delay: 3.2s; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (Behind content) -->
  <circle class="orb-1" cx="180" cy="90" r="140" fill="#38bdf8" filter="url(#strongGlow)" opacity="0.35" />
  <circle class="orb-2" cx="1020" cy="320" r="160" fill="#818cf8" filter="url(#strongGlow)" opacity="0.35" />
  <circle class="orb-1" cx="950" cy="80" r="100" fill="#c084fc" filter="url(#strongGlow)" opacity="0.25" />

  <!-- Cyber Grid -->
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Animated Dynamic Data Streams / Circuit Lines in Background -->
  <g opacity="0.45">
    <path class="stream-line" d="M -50 80 Q 300 160 600 60 T 1250 110" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line-rev" d="M -50 340 Q 400 240 800 360 T 1250 290" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="stream-line" d="M 100 420 L 350 280 L 850 280 L 1100 420" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="10, 8" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="particle" cx="220" cy="240" r="3" fill="#38bdf8" />
  <circle class="particle p2" cx="980" cy="180" r="3.5" fill="#c084fc" />
  <circle class="particle p3" cx="540" cy="360" r="2.5" fill="#34d399" />
  <circle class="particle p2" cx="720" cy="70" r="2" fill="#818cf8" />

  <!-- FOREGROUND CONTENT: Guaranteed sharp and unobstructed -->

  <!-- Top Category Pill Badge -->
  <g transform="translate(600, 72)">
    <rect x="-165" y="-18" width="330" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="-135" cy="0" r="5" fill="#34d399" filter="url(#glow)" />
    <text x="-120" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">ENTERPRISE TESTING ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" filter="url(#glow)" letter-spacing="-0.5">
    Awesome Enterprise Scalability &amp; Compliance
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
    Enterprise Test Orchestration, Governance Controls &amp; Self-Hosted Quality Platforms
  </text>

  <!-- Feature Metric Badges / Interactive Pills Row -->
  <g transform="translate(600, 280)">
    <!-- Pill 1: Test Orchestration -->
    <g transform="translate(-360, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ Test Orchestration</text>
    </g>

    <!-- Pill 2: Governance & Compliance -->
    <g transform="translate(-120, 0)">
      <rect x="-115" y="-18" width="230" height="36" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">🛡️ SSO • RBAC • Audit Logs</text>
    </g>

    <!-- Pill 3: Hybrid & Kubernetes -->
    <g transform="translate(130, 0)">
      <rect x="-115" y="-18" width="230" height="36" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#34d399">☸️ Kubernetes &amp; Self-Hosted</text>
    </g>

    <!-- Pill 4: Open-Source + Enterprise -->
    <g transform="translate(365, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f472b6">🌐 SaaS &amp; Open-Source</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="250" y="355" width="700" height="2" rx="1" fill="url(#primaryGrad)" opacity="0.7" />
  <circle cx="600" cy="356" r="4" fill="#38bdf8" filter="url(#glow)" />
</svg>
