<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b19"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".45" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="strongGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="25"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(20px,-15px);opacity:.6}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-25px) translateX(15px);opacity:.8}}@keyframes dashStream{0%{stroke-dashoffset:400}}@keyframes scanline{0%{transform:translateY(-50px);opacity:0}50%{opacity:.4}}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb 10s ease-in-out infinite 2s;transform-origin:1000px 300px}.stream-line{stroke-dasharray:20,10;animation:dashStream 12s linear infinite}.stream-line-rev{stroke-dasharray:15,12;animation:dashStream 9s linear infinite reverse}.particle{animation:floatParticle 5s ease-in-out infinite}.p2{animation-delay:1.8s}.p3{animation-delay:3.2s}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><circle cx="180" cy="90" r="140" fill="#38bdf8" class="orb-1" filter="url(#strongGlow)" opacity=".35"/><circle cx="1020" cy="320" r="160" fill="#818cf8" class="orb-2" filter="url(#strongGlow)" opacity=".35"/><circle cx="950" cy="80" r="100" fill="#c084fc" class="orb-1" filter="url(#strongGlow)" opacity=".25"/><rect width="1200" height="420" fill="url(#cyberGrid)"/><g opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M -50 80 Q 300 160 600 60 T 1250 110" class="stream-line"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M -50 340 Q 400 240 800 360 T 1250 290" class="stream-line-rev"/><path fill="none" stroke="#34d399" stroke-dasharray="10 8" stroke-width="1.5" d="M 100 420 L 350 280 L 850 280 L 1100 420" class="stream-line"/></g><circle cx="220" cy="240" r="3" fill="#38bdf8" class="particle"/><circle cx="980" cy="180" r="3.5" fill="#c084fc" class="particle p2"/><circle cx="540" cy="360" r="2.5" fill="#34d399" class="particle p3"/><circle cx="720" cy="70" r="2" fill="#818cf8" class="particle p2"/><g transform="translate(600, 72)"><rect width="330" height="36" x="-165" y="-18" fill="#1e293b" fill-opacity=".85" stroke="#38bdf8" stroke-width="1.5" rx="18"/><circle cx="-135" cy="0" r="5" fill="#34d399" filter="url(#glow)"/><text x="-120" y="5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">ENTERPRISE TESTING ECOSYSTEM</text></g><text x="600" y="165" fill="url(#primaryGrad)" filter="url(#glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome Enterprise Scalability &amp; Compliance</text><text x="600" y="215" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing=".2" text-anchor="middle">Enterprise Test Orchestration, Governance Controls &amp; Self-Hosted Quality Platforms</text><g><g transform="translate(600, 280) translate(-360, 0)"><rect width="210" height="36" x="-105" y="-18" fill="#0f172a" fill-opacity=".9" stroke="#334155" stroke-width="1.2" rx="10"/><text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Test Orchestration</text></g><g transform="translate(600, 280) translate(-120, 0)"><rect width="230" height="36" x="-115" y="-18" fill="#0f172a" fill-opacity=".9" stroke="#334155" stroke-width="1.2" rx="10"/><text x="0" y="5" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ SSO • RBAC • Audit Logs</text></g><g transform="translate(600, 280) translate(130, 0)"><rect width="230" height="36" x="-115" y="-18" fill="#0f172a" fill-opacity=".9" stroke="#334155" stroke-width="1.2" rx="10"/><text x="0" y="5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">☸️ Kubernetes &amp; Self-Hosted</text></g><g transform="translate(600, 280) translate(365, 0)"><rect width="200" height="36" x="-100" y="-18" fill="#0f172a" fill-opacity=".9" stroke="#334155" stroke-width="1.2" rx="10"/><text x="0" y="5" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 SaaS &amp; Open-Source</text></g></g><rect width="700" height="2" x="250" y="355" fill="url(#primaryGrad)" opacity=".7" rx="1"/><circle cx="600" cy="356" r="4" fill="#38bdf8" filter="url(#glow)"/></svg>